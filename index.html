<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quizzlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: squared exercise-book page; one centred column with divider tabs, subject highlighter colours, meme pop-ups over the question card */
:root{
  --paper:#EEF2F9; --grid:rgba(21,34,68,.07); --card:#FFFFFF; --ink:#152244; --muted:#56617A; --line:#D3DBEA;
  --hl:#EDE777; --on-hl:#152244;
  --school:#152244; --on-school:#FFFFFF; --sky:#BACAE5; --gold:#EDE777;
  --s1:#2A55C9; --s2:#D8384F; --s3:#168A5C; --s4:#C9680F; --s5:#7A4BD6; --s6:#0E8A9A; --s7:#B8338C; --s8:#5F7A12;
  --ok:#168A5C; --ok-bg:#E3F4EB; --bad:#C93B3B; --bad-bg:#FBE6E6;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-meme:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1730; --grid:rgba(186,202,229,.06); --card:#15213F; --ink:#EAF0FA; --muted:#A3B0C8; --line:#2A3858;
  --hl:#EDE777; --on-hl:#152244;
  --school:#1B2C57; --on-school:#FFFFFF; --sky:#BACAE5; --gold:#EDE777;
  --s1:#86A8FF; --s2:#FF8496; --s3:#55D39C; --s4:#FFAA5E; --s5:#B79BFF; --s6:#5FD6E3; --s7:#F58BD0; --s8:#B5D65A;
  --ok:#55D39C; --ok-bg:#183A2A; --bad:#FF8A8A; --bad-bg:#3D1E1E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1730; --grid:rgba(186,202,229,.06); --card:#15213F; --ink:#EAF0FA; --muted:#A3B0C8; --line:#2A3858;
  --hl:#EDE777; --on-hl:#152244;
  --school:#1B2C57; --on-school:#FFFFFF; --sky:#BACAE5; --gold:#EDE777;
  --s1:#86A8FF; --s2:#FF8496; --s3:#55D39C; --s4:#FFAA5E; --s5:#B79BFF; --s6:#5FD6E3; --s7:#F58BD0; --s8:#B5D65A;
  --ok:#55D39C; --ok-bg:#183A2A; --bad:#FF8A8A; --bad-bg:#3D1E1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(transparent 38%,var(--hl) 38%,var(--hl) 88%,transparent 88%);padding-inline:3px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--school);color:var(--on-school);border:2px solid var(--line);border-radius:16px;padding:12px 16px;background-image:linear-gradient(90deg,var(--gold) 0 50%,var(--sky) 50% 100%);background-size:100% 6px;background-position:bottom;background-repeat:no-repeat;padding-bottom:16px}
.crest{width:58px;height:auto;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.brand .disclaimer{display:block;width:100%;font-size:11px;letter-spacing:.04em;opacity:.75;margin-top:2px}
header.top .brand small{color:var(--sky)}
header.top .brand .hl{color:var(--on-hl)}
header.top .iconbtn{background:transparent;color:var(--on-school);border-color:rgba(255,255,255,.35)}
header.top .me{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:var(--on-school)}
header.top .me .who span{color:var(--sky)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 300px}
.brand-text{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:clamp(30px,6vw,42px);line-height:1}
.brand small{color:var(--muted);font-size:14px}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;min-width:0}
.me img{width:30px;height:30px;border-radius:50%}
.me .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.me .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.me .who span{font-size:12px;color:var(--muted)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.notice{margin-top:14px;border:1.5px dashed var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--muted)}

nav.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:2px solid var(--ink);overflow-x:auto}
nav.tabs button{border:2px solid transparent;border-bottom:0;background:transparent;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:700;color:var(--muted);white-space:nowrap;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);border-bottom:2px solid var(--card)}
section.panel{position:relative;background:var(--card);border:2px solid var(--ink);border-top:0;border-radius:0 0 var(--r) var(--r);padding:22px 18px 26px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
@media (min-width:640px){section.panel{padding:26px 28px 30px}}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}

.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lvl{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.lvl b{font-family:var(--f-display);font-weight:400;font-size:20px}
.lvl span{font-size:12px;color:var(--muted)}
.lvl[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.lvl[aria-pressed="true"] span{color:var(--on-hl)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-weight:700}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);background:var(--card);box-shadow:4px 4px 0 var(--ink)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.subj{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.subj:hover{transform:translateY(-2px) rotate(-.4deg);border-color:var(--c)}
.subj .tag{width:34px;height:10px;border-radius:3px;background:var(--c)}
.subj h3{font-size:20px;line-height:1.15}
.subj span{font-size:13px;color:var(--muted)}
.subj.mix{border-style:dashed}
.setup{display:grid;gap:12px;border:2px solid var(--ink);border-radius:var(--r);padding:16px;background:linear-gradient(var(--hl),var(--hl)) left top/6px 100% no-repeat,var(--card)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 170px;min-width:0}
.field label{font-size:13px;font-weight:700}
input[type=text],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 20px;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.hl-btn{background:var(--hl);color:var(--on-hl);border-color:var(--on-hl)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* game */
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c,var(--line));color:var(--c,var(--muted));border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted))}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.bad{background:var(--bad);border-color:var(--bad)}
.dots i.now{border-color:var(--ink)}
.combo{font-family:var(--f-display);font-size:18px;padding:2px 10px;border-radius:8px;background:var(--hl);color:var(--on-hl);transform-origin:center}
.combo.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}
.timer{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.timer div{height:100%;background:var(--ink);width:100%;transform-origin:left}
.timer.low div{background:var(--bad)}
.qtext{font-size:clamp(20px,3.6vw,26px);line-height:1.3;font-weight:700;max-width:42ch}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .k{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;border:1.5px solid currentColor;font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:var(--card);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt:disabled{cursor:default}
.feedback{border-left:6px solid var(--c);background:var(--paper);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.feedback b.v{font-family:var(--f-display);font-weight:400;font-size:22px}
.feedback .why{max-width:65ch}
.score-pop{font-family:var(--f-display);font-size:20px}

/* meme pop-up */
.meme-layer{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;padding:16px}
.meme{pointer-events:auto;width:min(340px,100%);background:#111;border:4px solid #fff;outline:3px solid #111;border-radius:6px;text-align:center;color:#fff;padding:12px 12px 14px;display:grid;gap:6px;transform:rotate(-2deg);animation:memein .4s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.meme.bad{transform:rotate(2deg)}
.meme .cap{font-family:var(--f-meme);font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.meme .face{font-size:74px;line-height:1.1}
.meme small{font-family:var(--f-body);font-size:12px;opacity:.7}
@keyframes memein{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.meme.out{animation:memeout .25s ease forwards}
@keyframes memeout{to{transform:scale(.6) rotate(8deg);opacity:0}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* final */
.final{display:grid;gap:16px}
.bigscore{font-family:var(--f-display);font-size:clamp(54px,12vw,84px);line-height:1}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.revlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.revlist li{border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--paper)}
.revlist li p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* ranking */
.rankhead{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.table-wrap{overflow-x:auto}
.rank{width:100%;border-collapse:collapse;min-width:380px}
.rank th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
.rank td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rank td.n,.rank th.n{text-align:right}
.rank tr.mine td{background:var(--ok-bg)}
.pos{font-family:var(--f-display);font-size:20px;width:44px}
.pos .medal{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--hl);color:var(--on-hl);border:2px solid var(--on-hl)}
.pname{font-weight:700;display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrp{font-size:12px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.kpi b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:14px}
.bar .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px;flex-wrap:wrap}
.bar .track{height:14px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:4px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}

.qform{display:grid;gap:12px}
.optrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qlist li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--paper)}
.qlist li div{min-width:0}
.qlist small{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--bad);font-weight:700;padding:4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);text-align:center;z-index:7}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* Standalone runtime: replaces the claude.ai artifact runtime with browser storage (data stays on this device). Teacher mode: add ?profesor=1 to the URL. */
(function(){
  const KEY="quizzlo-db",UKEY="quizzlo-uid";
  let store={};try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
  let uid;try{uid=localStorage.getItem(UKEY)}catch(e){}
  if(!uid){uid="u"+Math.random().toString(36).slice(2,10);try{localStorage.setItem(UKEY,uid)}catch(e){}}
  const subs=new Set();
  const emit=()=>subs.forEach(f=>f());
  const docSnap=p=>({id:p.split("/").pop(),exists:p in store,data:()=>store[p]?JSON.parse(JSON.stringify(store[p])):undefined});
  const docRef=p=>({id:p.split("/").pop(),
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));save();emit()},
    delete:async()=>{delete store[p];save();emit()},
    onSnapshot(cb){const f=()=>cb(docSnap(p));subs.add(f);f();return()=>subs.delete(f)}});
  const query=(name,ord,lim)=>({
    orderBy:(field,dir)=>query(name,{field,dir},lim),
    limit:n=>query(name,ord,n),
    onSnapshot(cb){const f=()=>{
      const depth=name.split("/").length+1;
      let docs=Object.keys(store).filter(k=>k.startsWith(name+"/")&&k.split("/").length===depth).map(docSnap);
      if(ord) docs.sort((a,b)=>{const x=a.data()[ord.field]||0,y=b.data()[ord.field]||0;return ord.dir==="desc"?y-x:x-y});
      if(lim) docs=docs.slice(0,lim);
      cb({docs})};subs.add(f);f();return()=>subs.delete(f)}});
  const db={doc:docRef,collection:name=>Object.assign(query(name),{doc:id=>docRef(name+"/"+(id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)))})};
  const editor=/[?&]profesor=1\b/.test(location.search);
  const user={me:async()=>({id:uid,name:"",avatarUrl:"",canEdit:editor})};
  window.addEventListener("storage",e=>{if(e.key===KEY){try{store=JSON.parse(e.newValue||"{}")}catch(_){}emit()}});
  window.claude={use:async n=>n==="db"?db:n==="user"?user:null};
})();
</script>

function confetti(n=70){
  if(reduce) return;
  const c=$("#fx"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cs=getComputedStyle(document.documentElement),cols=[1,2,3,4,5,7].map(i=>cs.getPropertyValue("--s"+i).trim()).concat([cs.getPropertyValue("--hl").trim()]);
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0;(function loop(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<90) requestAnimationFrame(loop); else {x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})();
}

/* ---------- game ---------- */
function renderTopics(){
  const s=pickSubj,S=SUBJ[s],qs=allQ().filter(q=>q.s===s),ts=topicsOf(s);
  panel.innerHTML=`<div class="actions"><button class="btn ghost" id="backSubj">← All subjects</button></div>

  <div class="subjects"><button class="subj mix" style="--c:${col(s)}" data-t=""><i class="tag"></i><h3>All topics</h3><span>${qs.length} questions</span></button>
  ${ts.map(t=>`<button class="subj" style="--c:${col(s)}" data-t="${esc(t)}"><i class="tag"></i><h3>${esc(t)}</h3><span>${qs.filter(q=>q.t===t).length} questions</span></button>`).join("")}</div>`;
  $("#backSubj").onclick=()=>{pickSubj=null;renderHome()};
  panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>startGame(mode,s,b.dataset.t||null));
}
function startGame(m,s,t){
  let pool=m==="review"?allQ().filter(q=>priv.review.includes(q.id)):allQ().filter(q=>(s==="mix"?SUBJ[q.s].l===level:q.s===s)&&(!t||q.t===t));
  if(!pool.length){toast("No questions here yet");return}
  const n=m==="blitz"?pool.length:Math.min(ROUND,pool.length);
  const qs=shuffle(pool).slice(0,n).map(q=>({q,order:shuffle([0,1,2,3])}));
  game={mode:m,subj:s,topic:t||null,lvl:level,qs,i:0,points:0,streak:0,best:0,marks:[],res:{},right:[],wrong:[],answered:false,done:false,saved:null,t0:performance.now()};
  if(m==="blitz") game.blitzEnd=performance.now()+BLITZ*1000;
  showQ();
}
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null}}
function showQ(){
  game.answered=false;game.qt0=performance.now();game.left=TIME;
  renderGame();
  if(game.mode!=="review") tick();
}
function tick(){
  stopTimer();
  const step=()=>{
    if(!game||game.done) return;
    const now=performance.now(),bar=$("#tbar"),wrap=$("#twrap"),num=$("#tnum");
    if(game.mode==="blitz"){
      const left=Math.max(0,(game.blitzEnd-now)/1000);
      if(bar){bar.style.transform=`scaleX(${left/BLITZ})`;wrap.classList.toggle("low",left<10);num.textContent=Math.ceil(left)+tr(" s left"," s restantes")}
      if(left<=0){endGame();return}
    } else if(!game.answered){
      game.left=Math.max(0,TIME-(now-game.qt0)/1000);
      if(bar){bar.style.transform=`scaleX(${game.left/TIME})`;wrap.classList.toggle("low",game.left<4);num.textContent=Math.ceil(game.left)+" s"}
      if(game.left<=0){answer(-1);return}
    } else return;
    timerId=requestAnimationFrame(step);
  };
  timerId=requestAnimationFrame(step);
}
function renderGame(){
  if(game.done){renderFinal();return}
  const it=game.qs[game.i],q=it.q,S=SUBJ[q.s];
  const blitz=game.mode==="blitz";
  panel.innerHTML=`
    <div class="gamebar">
      <span class="chip" style="--c:${col(q.s)}">${esc(S.name)}${game.topic?" · "+esc(game.topic):""}</span>
      ${blitz?`<span class="eyebrow">Blitz · ${game.right.length} ${tr("correct","aciertos")}</span>`:`<div class="dots" aria-label="Progress">${game.qs.map((_,k)=>`<i class="${game.marks[k]===true?"ok":game.marks[k]===false?"bad":k===game.i?"now":""}"></i>`).join("")}</div>`}
      <span class="actions" style="gap:8px">${game.streak>1?`<span class="combo" id="combo">x${game.streak}</span>`:""}<span class="score-pop mono">${fmt(game.points)} ${tr("pts","ptos")}</span></span>
    </div>
    ${game.mode!=="review"?`<div style="display:grid;gap:4px"><div class="timer" id="twrap"><div id="tbar"></div></div><span class="mono" id="tnum" style="font-size:13px;color:var(--muted)"></span></div>`:""}
    <div class="eyebrow">${blitz?tr("Question ","Pregunta ")+(game.i+1):tr(`Question ${game.i+1} of ${game.qs.length}`,`Pregunta ${game.i+1} de ${game.qs.length}`)}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${it.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="actions"><button class="btn ghost" id="quit">${blitz?tr("Stop","Parar"):tr("Quit match","Abandonar")}</button></div>`;
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
  $("#quit").onclick=()=>{stopTimer(); if(game.right.length+game.wrong.length>0){endGame()} else {game=null;renderHome()}};
  if(game.answered) paintAnswer(false);
  else if(game.mode!=="review"&&!timerId) tick();
}
function answer(oi){
  if(!game||game.answered||game.done) return;
  game.answered=true; if(game.mode==="match") stopTimer();
  const it=game.qs[game.i],q=it.q,ok=oi===q.a;
  const r=game.res[q.s]||(game.res[q.s]={a:0,c:0});r.a++;
  let gained=0;
  if(ok){r.c++;game.streak++;game.best=Math.max(game.best,game.streak);
    gained=game.mode==="match"?100+Math.round(game.left*5)+Math.min((game.streak-1)*15,75):game.mode==="blitz"?60+Math.min((game.streak-1)*10,60):50;
    game.points+=gained;game.right.push(q.id);}
  else{game.streak=0;game.wrong.push(q.id);}
  game.marks[game.i]=ok;it.picked=oi;it.gained=gained;
  paintAnswer(true);
}
function paintAnswer(fresh){
  const it=game.qs[game.i],q=it.q,ok=it.picked===q.a;
  panel.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi;if(oi===q.a)b.classList.add("right");else if(oi===it.picked)b.classList.add("wrong")});
  const sp=panel.querySelector(".score-pop");if(sp) sp.textContent=fmt(game.points)+tr(" pts"," ptos");
  if(fresh){
    if(ok){beep("ok");confetti(game.streak>=3?110:60);
      showMeme(isES()?(MEME_STREAK_ES[game.streak]||pick(MEME_OK_ES)):(MEME_STREAK[game.streak]||pick(MEME_OK)),false);
      if(game.streak>1){let c=$("#combo");if(!c){c=document.createElement("span");c.className="combo";c.id="combo";sp.before(c)}c.textContent="x"+game.streak;c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}}
    else{beep("bad");showMeme(isES()?(it.picked===-1?MEME_TIME_ES:pick(MEME_BAD_ES)):(it.picked===-1?MEME_TIME:pick(MEME_BAD)),true);const c=$("#combo");if(c) c.remove();}
  }
  if(game.mode==="blitz"){ // fast: brief flash then next
    $("#fb").innerHTML=ok?"":`<div class="feedback" style="--c:var(--bad)"><span>${tr("Answer:","Respuesta:")} <b>${esc(q.o[q.a])}</b></span></div>`;
    setTimeout(()=>{if(game&&!game.done&&game.answered&&game.qs[game.i]===it) next()},ok?650:1300);
    return;
  }
  const last=game.i===game.qs.length-1;
  $("#fb").innerHTML=`<div class="feedback" style="--c:${ok?"var(--ok)":"var(--bad)"}">
    <b class="v">${ok?tr(`Correct! +${it.gained}`,`¡Correcto! +${it.gained}`):(it.picked===-1?tr("Out of time","Se acabó el tiempo"):tr("Not quite","¡Casi!"))}</b>
    ${ok?"":`<span>${tr("The right answer is:","La respuesta correcta es:")} <b>${esc(q.o[q.a])}</b></span>`}
    ${q.e?`<span class="why"><b>${tr("Quick revision:","Para repasar:")}</b> ${esc(q.e)}</span>`:""}
  </div>
  <div class="actions" style="margin-top:12px"><button class="btn" id="next">${last?tr("See results","Ver resultados"):tr("Next question","Siguiente pregunta")} <span class="mono" style="opacity:.6;font-size:12px">↵</span></button></div>`;
  $("#next").onclick=next;
}
function next(){
  if(game.i<game.qs.length-1){game.i++;showQ()}
  else if(game.mode==="blitz"){game.qs=game.qs.concat(shuffle(game.qs.map(x=>({q:x.q,order:shuffle([0,1,2,3])}))));game.i++;showQ()}
  else endGame();
}
function endGame(){stopTimer();game.done=true;beep("end");if(game.right.length>=Math.ceil((game.right.length+game.wrong.length)*.8)&&game.right.length) confetti(140);renderFinal();saveRound()}
document.addEventListener("keydown",e=>{
  if(tab!=="play"||!game||game.done||e.target.matches("input,textarea,select")) return;
  const k=e.key.toUpperCase();let idx="ABCD".indexOf(k);if(idx<0) idx="1234".indexOf(k);
  if(!game.answered&&idx>=0){const b=panel.querySelectorAll(".opt")[idx];if(b) b.click()}
  else if(game.answered&&(e.key==="Enter"||e.key===" ")){const n=$("#next");if(n){e.preventDefault();n.click()}}
});
function verdict(p){if(isES()) return p===100?["PUNTUACIÓN PERFECTA","🏆","EL TRUCO QUE LOS PROFES ODIAN: ESTUDIAR"]:p>=80?["¿ÉPOCA DE EXÁMENES?","😤","QUE VENGAN"]:p>=50?["NADA MAL","👍","REPASA LOS FALLOS Y OTRA VEZ"]:["TODO EXPERTO","🌱","EMPEZÓ SIENDO PRINCIPIANTE"];return p===100?["PERFECT SCORE","🏆","TEACHERS HATE THIS ONE TRICK: STUDYING"]:p>=80?["EXAM SEASON?","😤","BRING IT ON"]:p>=50?["NOT BAD","👍","REVIEW THE MISTAKES AND GO AGAIN"]:["EVERY EXPERT","🌱","WAS ONCE A BEGINNER"]}
function renderFinal(){
  const n=game.right.length+game.wrong.length,c=game.right.length,p=pct(c,n);
  const seen=new Set(),fails=[];game.qs.forEach(it=>{if(it.picked!==undefined&&it.picked!==it.q.a&&!seen.has(it.q.id)){seen.add(it.q.id);fails.push(it)}});
  const st=game.saved===null?(saving()?tr("Saving…","Guardando…"):tr("Practice mode: these points aren't saved","Modo práctica: estos puntos no se guardan")):game.saved?tr("Saved to the leaderboard","Guardado en el ranking"):tr("Couldn't save. Check your connection and play again.","No se pudo guardar. Revisa la conexión y vuelve a jugar.");
  const v=verdict(p);
  panel.innerHTML=`<div class="final">
    <div class="eyebrow">${game.mode==="blitz"?tr("Blitz over","Fin del Blitz"):game.mode==="review"?tr("Review done","Repaso terminado"):tr("Match over","Fin de la partida")}</div>
    <div class="row" style="align-items:center;gap:20px">
      <div class="bigscore"><span class="hl">${fmt(game.points)}</span> <span style="font-size:.4em">${tr("points","puntos")}</span></div>
      <div class="meme" style="width:220px;animation:none;transform:rotate(-2deg)"><div class="cap" style="font-size:18px">${v[0]}</div><div class="face" style="font-size:52px">${v[1]}</div><div class="cap" style="font-size:16px">${v[2]}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${c}/${n}</b><span>${tr("correct","aciertos")}</span></div>
      <div class="stat"><b>${p}%</b><span>${tr("accuracy","precisión")}</span></div>
      <div class="stat"><b>${game.best}</b><span>${tr("best streak","mejor racha")}</span></div>
    </div>
    <p class="sub" id="saveState">${st}</p>
    <div class="actions"><button class="btn hl-btn" id="again">${tr("Play again","Jugar otra vez")}</button><button class="btn ghost" id="toRank">${tr("Leaderboard","Ranking")}</button></div>
    ${fails.length?`<div><h3 style="font-size:22px;margin-bottom:10px">${tr("Revise your mistakes","Repasa tus fallos")}</h3><ul class="revlist">${fails.map(it=>`<li><b>${esc(it.q.q)}</b><p>${tr("Answer:","Respuesta:")} <b style="color:var(--ink)">${esc(it.q.o[it.q.a])}</b>${it.q.e?" — "+esc(it.q.e):""}</p></li>`).join("")}</ul>
      ${saving()?`<p class="sub">${tr("Added to “Fix my mistakes”.","Añadidas a “Fix my mistakes”.")}</p>`:""}</div>`:(n?`<div class="empty"><b>${tr("Clean sheet!","¡Pleno!")}</b>${tr("No mistakes this time.","Ningún fallo esta vez.")}</div>`:"")}
  </div>`;
  $("#again").onclick=()=>{const m=game.mode,s=game.subj,t=game.topic;game=null; if(m==="review") renderHome(); else startGame(m,s,t)};
  $("#toRank").onclick=()=>{game=null;$("#tab-ranking").click()};
}

/* ---------- saving ---------- */
function blankScore(){return{alias:"",level:"",klass:"",points:0,answered:0,correct:0,rounds:0,bestStreak:0,subj:{},updated:Date.now()}}
function cleanMine(){const b=blankScore();if(!mine) return b;const m=JSON.parse(JSON.stringify(mine));delete m.id;const o=Object.assign(b,m);if(!o.subj||typeof o.subj!=="object") o.subj={};return o}
async function saveProfile(alias,lvl,klass){
  if(!saving()) return;
  const d=cleanMine();d.alias=alias.slice(0,24);d.level=LEVELS[lvl]?lvl:"igcse";d.klass=klass.slice(0,12);d.updated=Date.now();
  try{await db.doc("scores/"+uid).set(d);mine={...d,id:uid};level=d.level;toast("Player card saved");render()}catch(e){handleWriteErr(e)}
}
function handleWriteErr(e){if(e&&e.code==="invalid_argument"){canWrite=false;render()}else toast("Couldn't save. Try again.")}
async function saveRound(){
  const g=game;if(!saving()) return;
  const d=cleanMine();if(!d.alias) d.alias=profileName||"Player";if(!d.level) d.level=g.lvl;
  d.points+=g.points;d.rounds+=1;d.bestStreak=Math.max(d.bestStreak||0,g.best);d.updated=Date.now();
  for(const k in g.res){const s=d.subj[k]||(d.subj[k]={a:0,c:0});s.a+=g.res[k].a;s.c+=g.res[k].c;d.answered+=g.res[k].a;d.correct+=g.res[k].c}
  let ok=true;
  try{await db.doc("scores/"+uid).set(d);mine={...d,id:uid}}catch(e){ok=false;handleWriteErr(e)}
  if(ok){
    let review=priv.review.filter(id=>!g.right.includes(id));g.wrong.forEach(id=>{if(!review.includes(id)) review.push(id)});review=review.slice(-200);
    const history=[{t:Date.now(),m:g.mode,s:g.subj,l:g.lvl,p:g.points,c:g.right.length,n:g.right.length+g.wrong.length},...priv.history].slice(0,15);
    try{await db.doc("data/users/"+uid+"/me").set({review,history});priv={review,history}}catch(e){}
  }
  g.saved=ok;
  if(game===g&&tab==="play"){const s=$("#saveState");if(s) s.textContent=ok?tr("Saved to the leaderboard","Guardado en el ranking"):tr("Couldn't save. Check your connection and play again.","No se pudo guardar. Revisa la conexión y vuelve a jugar.")}
  renderHeader();
}

/* ---------- leaderboard ---------- */
function players(){return scores.filter(p=>p.alias&&(p.answered||0)>0)}
function renderRanking(){
  const ps=players().filter(p=>rankLevel==="all"||p.level===rankLevel);
  const classes=[...new Set(ps.map(p=>p.klass).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"en",{numeric:true}));
  if(rankClass!=="all"&&!classes.includes(rankClass)) rankClass="all";
  let body;
  if(!ready) body=`<div class="empty"><b>Loading the leaderboard…</b></div>`;
  else if(!db) body=`<div class="empty"><b>Leaderboard not available here</b>Open the page signed in to Claude to see the school's scores.</div>`;
  else if(!ps.length) body=`<div class="empty"><b>No scores yet</b>Play a match and you'll be number one.</div>`;
  else if(rankView==="students"){
    const list=ps.filter(p=>rankClass==="all"||p.klass===rankClass).sort((a,b)=>(b.points||0)-(a.points||0));
    body=`<div class="table-wrap"><table class="rank"><thead><tr><th>#</th><th>Player</th><th class="n">Accuracy</th><th class="n">Streak</th><th class="n">Points</th></tr></thead><tbody>
    ${list.map((p,i)=>`<tr class="${p.id===uid?"mine":""}"><td class="pos">${i<3?`<span class="medal">${i+1}</span>`:i+1}</td>
      <td><span class="pname">${esc(p.alias)}${p.id===uid?" (you)":""}</span><span class="pgrp">${esc(p.klass||"No class")} · ${esc(LEVELS[p.level]?LEVELS[p.level].name:"")} · ${fmt(p.rounds)} games</span></td>
      <td class="n mono">${pct(p.correct,p.answered)}%</td><td class="n mono">${p.bestStreak||0}</td><td class="n mono"><b>${fmt(p.points)}</b></td></tr>`).join("")}
    </tbody></table></div>`;
  } else {
    const agg={};ps.forEach(p=>{const g=p.klass||"No class";const a=agg[g]||(agg[g]={g,points:0,n:0,a:0,c:0});a.points+=p.points||0;a.n++;a.a+=p.answered||0;a.c+=p.correct||0});
    const list=Object.values(agg).sort((a,b)=>b.points-a.points),max=list[0]?list[0].points||1:1;
    body=`<div class="bars">${list.map((g,i)=>`<div class="bar" style="--c:${i===0?"var(--hl)":"var(--ink)"}"><div class="lbl"><span><b>${i+1}. ${esc(g.g)}</b> <span style="color:var(--muted)">· ${g.n} ${g.n===1?"player":"players"} · ${pct(g.c,g.a)}% correct</span></span><span class="mono"><b>${fmt(g.points)}</b> pts</span></div>
      <div class="track"><div class="fill" style="width:${Math.max(2,g.points/max*100)}%;${i===0?"box-shadow:inset 0 0 0 2px var(--on-hl)":""}"></div></div></div>`).join("")}</div>
      <p class="sub">A class's score is the total of its players' points.</p>`;
  }
  panel.innerHTML=`<div class="rankhead"><div><h2 style="font-size:28px">School leaderboard</h2><p class="sub">Updates live whenever someone finishes a game.</p></div>
    <div class="seg" role="group" aria-label="View"><button id="rv-s" aria-pressed="${rankView==="students"}">Students</button><button id="rv-c" aria-pressed="${rankView==="classes"}">Classes</button></div></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Stage"><button data-rl="all" aria-pressed="${rankLevel==="all"}">All</button>${Object.keys(LEVELS).map(k=>`<button data-rl="${k}" aria-pressed="${rankLevel===k}">${LEVELS[k].name}</button>`).join("")}</div>
      ${rankView==="students"&&classes.length?`<div class="field" style="max-width:200px"><label for="rc">Class</label><select id="rc"><option value="all">All classes</option>${classes.map(g=>`<option ${g===rankClass?"selected":""} value="${esc(g)}">${esc(g)}</option>`).join("")}</select></div>`:""}
    </div>${body}`;
  $("#rv-s").onclick=()=>{rankView="students";renderRanking()};$("#rv-c").onclick=()=>{rankView="classes";renderRanking()};
  panel.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{rankLevel=b.dataset.rl;renderRanking()});
  const rc=$("#rc");if(rc) rc.onchange=()=>{rankClass=rc.value;renderRanking()};
}

/* ---------- progress ---------- */
function renderProgress(){
  if(!saving()&&!mine){panel.innerHTML=`<h2 style="font-size:28px">My progress</h2><div class="empty"><b>Your progress will show here</b>${!db||!uid?"Open the page signed in to Claude to save your games.":"Your account can't save scores in this game."}</div>`;return}
  const d=cleanMine(),lv=myLevel();
  const ranked=players().sort((a,b)=>(b.points||0)-(a.points||0)),pos=ranked.findIndex(p=>p.id===uid);
  const revN=priv.review.filter(id=>allQ().some(q=>q.id===id)).length;
  const keys=[...new Set(subjOf(lv).concat(Object.keys(d.subj).filter(k=>SUBJ[k])))];
  const weakest=keys.filter(k=>(d.subj[k]||{}).a>=3).sort((a,b)=>pct(d.subj[a].c,d.subj[a].a)-pct(d.subj[b].c,d.subj[b].a))[0];
  panel.innerHTML=`
    <div><h2 style="font-size:28px">My progress</h2><p class="sub">${d.answered?(weakest?`Your best chance to improve: <b>${esc(SUBJ[weakest].name)}</b>.`:"Keep playing to find out which subject needs more work."):"You haven't played a game yet."}</p></div>
    <div class="kpis">
      <div class="kpi"><b>${fmt(d.points)}</b><span>points</span></div>
      <div class="kpi"><b>${pos>=0?"#"+(pos+1):"–"}</b><span>school position</span></div>
      <div class="kpi"><b>${pct(d.correct,d.answered)}%</b><span>correct (${fmt(d.correct)} of ${fmt(d.answered)})</span></div>
      <div class="kpi"><b>${d.bestStreak||0}</b><span>best streak</span></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:10px">Accuracy by subject</div>
    <div class="bars">${keys.map(k=>{const s=d.subj[k]||{a:0,c:0};return `<div class="bar" style="--c:${col(k)}"><div class="lbl"><b>${esc(SUBJ[k].name)}</b><span class="mono">${s.a?pct(s.c,s.a)+"% · "+s.c+"/"+s.a:"not played yet"}</span></div><div class="track"><div class="fill" style="width:${pct(s.c,s.a)}%"></div></div></div>`}).join("")}</div></div>
    <div class="actions"><button class="btn hl-btn" id="goRev" ${revN?"":"disabled"}>Fix my mistakes (${revN})</button></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Recent games</div>
      ${priv.history.length?`<ul class="hist">${priv.history.map(h=>`<li><span>${h.m==="review"?"Review":h.m==="blitz"?"Blitz":"Match"} · ${h.s==="mix"?"Mix":esc((SUBJ[h.s]||{}).name||"")} · ${new Date(h.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span><span class="mono">${h.c}/${h.n} · ${fmt(h.p)} pts</span></li>`).join("")}</ul>`:`<p class="sub">Your recent games will appear here.</p>`}
    </div>
    ${saving()?`<form class="setup" id="editForm"><div class="eyebrow">My player card</div>
      <div class="row"><div class="field"><label for="ealias">Name or nickname</label><input type="text" id="ealias" maxlength="24" required value="${esc(d.alias||profileName)}"></div>
      <div class="field"><label for="elvl">Stage</label><select id="elvl">${Object.keys(LEVELS).map(k=>`<option value="${k}" ${k===lv?"selected":""}>${LEVELS[k].name}</option>`).join("")}</select></div>
      <div class="field"><label for="eklass">Class</label><input type="text" id="eklass" maxlength="12" required value="${esc(d.klass)}"></div></div>
      <div class="actions"><button class="btn" type="submit">Save changes</button></div></form>`:""}`;
  $("#goRev").onclick=()=>{mode="review";$("#tab-play").click();startGame("review","mix")};
  const f=$("#editForm");if(f) f.onsubmit=e=>{e.preventDefault();const a=$("#ealias").value.trim(),k=$("#eklass").value.trim();if(a&&k) saveProfile(a,$("#elvl").value,k)};
}

/* ---------- teachers ---------- */
let draft={s:"imat",q:"",o:["","","",""],a:0,e:""};
function renderTeachers(){
  if(!isEditor){panel.innerHTML=`<div class="empty"><b>Teachers only</b>This section is for people who can edit the game.</div>`;return}
  const list=bankExtra.slice().sort((a,b)=>(b.t||0)-(a.t||0));
  panel.innerHTML=`
    <div><h2 style="font-size:28px">Add questions</h2><p class="sub">New questions go live in everyone's games straight away. Keep them short: one right answer and three believable wrong ones.</p></div>
    <form class="qform" id="qf">
      <div class="field" style="max-width:320px"><label for="qs">Subject</label><select id="qs">${Object.keys(LEVELS).map(l=>`<optgroup label="${LEVELS[l].name}">${subjOf(l).map(k=>`<option value="${k}" ${draft.s===k?"selected":""}>${esc(SUBJ[k].name)}</option>`).join("")}</optgroup>`).join("")}</select></div>
      <div class="field"><label for="qq">Question</label><input type="text" id="qq" maxlength="240" required value="${esc(draft.q)}" placeholder="e.g. What is the capital of Australia?"></div>
      <div class="field"><label>Answers (tick the right one)</label>
        ${[0,1,2,3].map(i=>`<div class="optrow"><input type="radio" name="qa" id="qa${i}" value="${i}" ${draft.a===i?"checked":""} aria-label="Answer ${"ABCD"[i]} is correct"><input type="text" id="qo${i}" maxlength="120" required value="${esc(draft.o[i])}" placeholder="Answer ${"ABCD"[i]}"></div>`).join("")}</div>
      <div class="field"><label for="qe">Quick revision note</label><textarea id="qe" maxlength="400" placeholder="Why it's right. Shown after answering.">${esc(draft.e)}</textarea></div>
      <div class="actions"><button class="btn hl-btn" type="submit">Add question</button></div>
    </form>
    <div><div class="eyebrow" style="margin-bottom:8px">Questions added by teachers (${list.length})</div>
      ${list.length?`<ul class="qlist">${list.map(q=>`<li><div><span class="chip" style="--c:${col(q.s)}">${esc(LEVELS[SUBJ[q.s].l].name)} · ${esc(SUBJ[q.s].name)}</span><div style="margin-top:4px"><b>${esc(q.q)}</b></div><small>Right answer: ${esc(q.o[q.a])}</small></div><button class="linkbtn" data-del="${esc(q._doc)}">Delete</button></li>`).join("")}</ul>`
      :`<div class="empty"><b>No extra questions yet</b>The game comes with ${BASE.length} questions. Yours are added on top.</div>`}
    </div>`;
  const keep=()=>{draft={s:$("#qs").value,q:$("#qq").value,o:[0,1,2,3].map(i=>$("#qo"+i).value),a:+((panel.querySelector('input[name=qa]:checked')||{}).value||0),e:$("#qe").value}};
  panel.querySelectorAll("#qf input,#qf select,#qf textarea").forEach(el=>el.addEventListener("input",keep));
  $("#qf").onsubmit=async e=>{e.preventDefault();keep();
    const q={s:draft.s,q:draft.q.trim(),o:draft.o.map(x=>x.trim()),a:draft.a,e:draft.e.trim(),by:uid||"",t:Date.now()};
    if(!validQ(q)){toast("Fill in the question and all four answers");return}
    if(new Set(q.o.map(x=>x.toLowerCase())).size<4){toast("The four answers must be different");return}
    try{await db.collection("bank").doc().set(q);draft={s:q.s,q:"",o:["","","",""],a:0,e:""};toast("Question added");renderTeachers()}
    catch(err){toast(err&&err.code==="quota_exceeded"?"The question bank is full. Delete some to add more.":"Couldn't add it. Check you have edit access.")}};
  panel.querySelectorAll("[data-del]").forEach(b=>{let armed=false;b.onclick=async()=>{
    if(!armed){armed=true;b.textContent="Sure? Tap again";setTimeout(()=>{armed=false;b.textContent="Delete"},3000);return}
    try{await db.doc("bank/"+b.dataset.del).delete();toast("Question deleted")}catch(e){toast("Couldn't delete it")}}});
}

/* ---------- boot ---------- */
render();
(async function boot(){
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [db,user]=await Promise.all([use("db"),use("user")]);
  if(user){try{const me=await user.me();uid=me.id;profileName=me.name||"";avatar=me.avatarUrl||"";isEditor=!!me.canEdit}catch(e){}}
  ready=true;
  const busy=()=>tab==="play"&&game&&!game.done;
  if(db){
    const onErr=()=>{};
    db.collection("bank").onSnapshot(s=>{bankExtra=s.docs.map(d=>({...d.data(),id:"t_"+d.id,_doc:d.id})).filter(validQ);busy()?renderHeader():render()},onErr);
    db.collection("scores").orderBy("points","desc").limit(1000).onSnapshot(s=>{scores=s.docs.map(d=>({...d.data(),id:d.id}));busy()||(tab==="play"&&game)?renderHeader():render()},onErr);
    if(uid){
      db.doc("scores/"+uid).onSnapshot(s=>{const first=mine===null;mine=s.exists?{...s.data(),id:uid}:null;if(first&&mine&&LEVELS[mine.level]&&!game) level=mine.level;busy()||(tab==="play"&&game)?renderHeader():render()},onErr);
      db.doc("data/users/"+uid+"/me").onSnapshot(s=>{if(s.exists){const d=s.data();priv={review:Array.isArray(d.review)?d.review:[],history:Array.isArray(d.history)?d.history:[]}}if(!game) render()},onErr);
    }
  }
  render();
})();
</script>


</body></html>
